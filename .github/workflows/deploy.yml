name: Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  deployments: write

jobs:
  deploy-preview:
    name: Deploy to Vercel (Preview)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci_placeholder_key' }}
          APP_URL: ${{ secrets.APP_URL || 'https://clipforge.vercel.app' }}

      - name: Check Vercel Token
        id: check-token
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::VERCEL_TOKEN secret is not set. To enable automatic preview deploys to Vercel via GitHub Actions, add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID under Repository Settings > Secrets and variables > Actions. (Alternatively, import the repository directly in the Vercel dashboard for zero-config automatic git deployments)."
          fi

      - name: Deploy to Vercel (Preview)
        if: steps.check-token.outputs.configured == 'true'
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./

  deploy-production:
    name: Deploy to Vercel (Production)
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci_placeholder_key' }}
          APP_URL: ${{ secrets.APP_URL || 'https://clipforge.vercel.app' }}

      - name: Check Vercel Token
        id: check-token
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::VERCEL_TOKEN secret is not set. To enable automatic production deploys to Vercel via GitHub Actions, add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID under Repository Settings > Secrets and variables > Actions. (Alternatively, import the repository directly in the Vercel dashboard for zero-config automatic git deployments)."
          fi

      - name: Deploy to Vercel (Production)
        if: steps.check-token.outputs.configured == 'true'
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
